name: Lint & Format Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-format:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - uses: actions/checkout@v4

      - name: 🔍 Preflight - Verify npm lockfiles exist
        run: |
          if [ ! -f npm-shrinkwrap.json ]; then
            echo '❌ Missing npm-shrinkwrap.json. Run `npm shrinkwrap` locally.'
            exit 1
          fi

          if [ ! -f backend/package-lock.json ]; then
            echo '❌ Missing backend/package-lock.json. Run `npm --prefix backend install --package-lock-only`.'
            exit 1
          fi

          echo '✅ npm lockfiles verified.'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: 'npm'
          cache-dependency-path: |
            npm-shrinkwrap.json
            backend/package-lock.json

      - name: Verify lockfile consistency
        run: |
          if ! grep -q '"picomatch"' npm-shrinkwrap.json; then
            echo "❌ Drift detected: picomatch missing in shrinkwrap."
            echo "Re-run: npm install && npm shrinkwrap"
            exit 1
          fi

          echo "✅ Lockfile marker verified."

      - name: Install dependencies (root)
        run: npm ci --legacy-peer-deps --omit=optional

      - name: Install dependencies (backend)
        run: npm --prefix backend ci --legacy-peer-deps --omit=optional

      - name: Verify dependency tree (post-install)
        run: |
          npm ls > /dev/null || {
            echo "❌ Dependency tree mismatch"
            exit 1
          }
          echo "✅ Dependency tree verified."

      - name: Check for modified lockfiles
        run: |
          if ! git diff --exit-code npm-shrinkwrap.json; then
            echo "❌ Lockfile drift detected after build"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:ci
